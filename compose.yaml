services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: avto
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: avto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - avto_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avto -d avto"]
      interval: 5s
      timeout: 4s
      retries: 10
volumes:
  avto_pg:
